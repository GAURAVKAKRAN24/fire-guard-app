<aside class="sidebar" [class.mobile-open]="isOpen">

  <button class="mobile-close" (click)="closeMenu()" aria-label="Close menu">
    ✕
  </button>

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3c2.3 2.5 4 4.9 4 7.4a4 4 0 0 1-8 0C8 7.9 9.7 5.5 12 3Z" />
        <path d="M12 12v7" />
        <path d="M9 18h6" />
      </svg>
    </div>

    <div class="brand-text">
      <span class="brand-name">FireGuard</span>
      <span class="brand-subtitle">Management System</span>
    </div>
  </div>

  <nav class="navigation">
    <div class="nav-section" (click)="closeMenu()">
      <span class="section-title">MAIN</span>

      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></svg>
        </span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/customers" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"/><circle cx="10" cy="7" r="4"/><path d="M20 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span>Customers</span>
      </a>

      <a class="nav-item" routerLink="/extinguishers" routerLinkActive="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6"/><path d="M10 3v4l-1 3h6l-1-3V3"/><path d="M8 10h8l1 9H7l1-9Z"/></svg>
        </span>
        <span>Extinguishers</span>
      </a>

      <a class="nav-item" routerLink="/services" routerLinkActive="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 0 1 0 1.4l-8.9 8.9-3.8 1.2 1.2-3.8 8.5-8.3Z"/><path d="M14 4l6 6"/></svg>
        </span>
        <span>Services</span>
      </a>
    </div>

    <div class="nav-section" (click)="closeMenu()">
      <span class="section-title">MANAGEMENT</span>

      <a class="nav-item" routerLink="/notifications" routerLinkActive="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        </span>
        <span>Notifications</span>
        <span class="notification-badge">3</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <a class="nav-item" (click)="closeMenu()">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.15V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.15.4l-.09.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.15-.4H2.75a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.4-1.15l-.06-.09a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.15V2.75a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.15-.4l.09-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.24.22.55.38.9.4h.09a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.9.4 1.7 1.7 0 0 0-.4 1.15v.09Z"/></svg>
      </span>
      <span>Settings</span>
    </a>

    <div class="user-card">
      <div class="avatar">G</div>

      <div class="user-info">
        <strong>Gaurav</strong>
        <span>Administrator</span>
      </div>

      <button class="more-button" aria-label="More actions">⋮</button>
    </div>
  </div>
</aside>
