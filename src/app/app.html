<div class="app-layout">

  <app-global-loader />
  <app-notification-center />
  <app-confirmation-dialog />

  <app-sidebar
    [isOpen]="sidebarOpen"
    (menuClose)="closeSidebar()">
  </app-sidebar>

  <main class="main-content">

    <header class="top-header">

      <button
        class="menu-button"
        (click)="openSidebar()">
        ☰
      </button>

      <div class="page-title">
        <h1>Dashboard</h1>
        <p>Fire Safety Management System</p>
      </div>

      <label class="global-search">
        <span aria-hidden="true">⌕</span>
        <input type="search" placeholder="Search customers, extinguishers, locations…" aria-label="Global search">
      </label>

      <div class="header-actions">

        <button class="header-button">
          🔔
          <span class="notification-dot"></span>
        </button>

        <div class="header-avatar">
          G
        </div>

      </div>

    </header>

   <section class="page-content">

    <router-outlet></router-outlet>

  </section>

  </main>

  <nav class="mobile-tabs" aria-label="Primary navigation">
    <a routerLink="/dashboard" routerLinkActive="active"><span>⌂</span><small>Home</small></a>
    <a routerLink="/customers" routerLinkActive="active"><span>♙</span><small>Customers</small></a>
    <a routerLink="/extinguishers" routerLinkActive="active"><span>▣</span><small>Units</small></a>
    <a routerLink="/services" routerLinkActive="active"><span>✓</span><small>Services</small></a>
  </nav>

</div>
